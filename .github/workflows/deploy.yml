name: Build, Push and Deploy Backend to EC2
on:
  push:
    branches:
      - prod
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'Dockerfile'
      - 'docker-compose.prod.yml'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0
      - name: Login to Docker Hub
        uses: docker/login-action@v3.4.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6.15.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/hr-application:latest
            ${{ secrets.DOCKER_USERNAME }}/hr-application:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/hr-application:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/hr-application:buildcache,mode=max
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script: |
            cd /home/${{ secrets.EC2_USERNAME }}/hr_deploy
            sudo curl -o docker-compose.prod.yml https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/docker-compose.prod.yml
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/hr-application:latest
            sudo docker compose -f docker-compose.prod.yml down
            sudo docker compose -f docker-compose.prod.yml up -d
            sudo docker image prune -af
            sudo docker ps
      - name: Verify deployment
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script: |
            echo "Waiting for application to start..."
            sleep 30

            if sudo docker ps | grep hr_application_prod; then
              echo "✅ Container is running"
            else
              echo "❌ Container is not running"
              sudo docker ps -a | grep hr_application_prod
              exit 1
            fi

            echo "Recent logs:"
            sudo docker logs --tail 50 hr_application_prod

            echo "🎉 Deployment completed successfully!"
